<script>
(function(){
if(window.hongbaoOpen) return;
var HB={base:'plugin.php?id=hongbao:',fh:'XXXXXXXX',cur:null,cat:'🐱'};
function $(id){return document.getElementById(id);}
function post(url,body){return fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body});}
window.hongbaoClose=function(){$('hb_mask').classList.remove('show');};
window.hongbaoOpen=function(el){
  if(HB.dailyTimer){ clearTimeout(HB.dailyTimer); HB.dailyTimer=null; } // 使用者主動開包時,取消待發的每日彈窗計時器
  var tid=el.getAttribute('data-tid');
  fetch(HB.base+'open&tid='+tid,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(c){
    if(!c.ok){ alert(c.error||'紅包不存在'); return; }
    HB.cur=c; HB.cur.el=el;
    var env=$('hb_env');
    env.classList.remove('opened','haspw','hasamt');
    if(c.haspw) env.classList.add('haspw');
    $('hb_from').textContent=c.from;
    $('hb_bless').innerText=(c.bless||'');
    $('hb_who').textContent=c.from;
    $('hb_bless2').textContent=(c.bless||'').split('\\n')[0];
    $('hb_unit').textContent=c.unit||'';
    $('hb_amt').textContent=''; $('hb_statemsg').textContent='';
    $('hb_pw').value=''; $('hb_pwerr').textContent='';
    $('hb_recs').classList.remove('show'); $('hb_recs').innerHTML='';
    $('hb_reclink').style.display='none';
    $('hb_cat').classList.remove('jump'); $('hb_bigtag').classList.remove('show');
    ['hb_s1','hb_s2','hb_s3','hb_s4'].forEach(function(i){$(i).classList.remove('go');});
    var btn=$('hb_openbtn'); btn.classList.remove('spin'); btn.disabled=false;
    var wd=$('hb_wdbtn'); wd.style.display='none'; wd.disabled=false;
    if(c.mine&&c.mine.claimed){ showResult(c.mine.amount,false,c.mine.best==1,true); }
    else if(c.state!=='open'){ btn.style.display='none'; env.classList.remove('hasamt'); env.classList.add('opened'); $('hb_amt').textContent=''; $('hb_statemsg').textContent=stateText(c.state); $('hb_reclink').style.display=c.is_sender?'inline':'none'; }
    else if(c.is_sender){ btn.style.display='none'; wd.style.display='block'; }
    else { btn.style.display='block'; }
    $('hb_mask').classList.add('show');
  });
};
function stateText(s){return {done:'紅包已被搶光',withdrawn:'紅包已被撤回',expired:'紅包已過期',closed:'紅包已被關閉'}[s]||'紅包已結束';}
function showResult(amount,iscat,best,already){
  var env=$('hb_env'),btn=$('hb_openbtn');
  $('hb_amt').textContent=amount; $('hb_statemsg').textContent='';
  btn.style.display='none'; env.classList.add('opened','hasamt'); $('hb_reclink').style.display='inline';
  if(iscat){ $('hb_cat').innerHTML=HB.cat; $('hb_cat').classList.add('jump'); $('hb_bigtag').classList.add('show'); ['hb_s1','hb_s2','hb_s3','hb_s4'].forEach(function(i){$(i).classList.add('go');}); }
  if(HB.cur&&HB.cur.el){ HB.cur.el.classList.add('claimed'); var m=HB.cur.el.querySelector('.claimed-mark'); if(m){m.style.display='block';m.textContent='已領取';} }
}
window.hongbaoDailyInit=function(cfg){
  HB.daily=cfg;
  if(cfg.entry==2){ var f=document.createElement('div'); f.className='float-hb'; f.innerHTML='<div class="body"><div class="dot"></div><div class="lbl">紅包</div></div>'; f.onclick=hongbaoDailyOpen; document.body.appendChild(f); }
  else { // popup:尊重「今日不再顯示」
    var skip=null; try{ skip=localStorage.getItem('hb_daily_skip'); }catch(e){}
    if(skip!=cfg.dateflag){
      HB.dailyTimer=setTimeout(function(){
        HB.dailyTimer=null;
        // 自動彈窗:若使用者已在跟別的紅包互動(卡片開包中),不搶走畫面——下次登入或改用浮標仍可領。
        if($('hb_mask').classList.contains('show')){ return; }
        hongbaoDailyOpen();
      },600);
    }
  }
};
window.hongbaoDailyOpen=function(){
  var cfg=HB.daily||{}; HB.cur={isdaily:true,tid:0,haspw:false,unit:cfg.unit||'',el:null};
  var env=$('hb_env'); env.classList.remove('opened','haspw','hasamt');
  $('hb_from').textContent=cfg.from||'系統 每日紅包'; $('hb_bless').innerText=cfg.bless||'今日登入紅包';
  $('hb_who').textContent=cfg.from||'系統 每日紅包'; $('hb_bless2').textContent=(cfg.bless||'今日登入紅包').split('\\n')[0];
  $('hb_unit').textContent=cfg.unit||''; $('hb_amt').textContent=''; $('hb_statemsg').textContent='';
  $('hb_reclink').style.display='none'; $('hb_recs').classList.remove('show'); $('hb_recs').innerHTML='';
  $('hb_cat').classList.remove('jump'); $('hb_bigtag').classList.remove('show');
  ['hb_s1','hb_s2','hb_s3','hb_s4'].forEach(function(i){$(i).classList.remove('go');});
  var b=$('hb_openbtn'); b.classList.remove('spin'); b.disabled=false; b.style.display='block';
  $('hb_wdbtn').style.display='none';
  var sk=$('hb_dailyskip'); sk.style.display=(cfg.entry==1)?'block':'none';
  $('hb_skipchk').checked=false;
  $('hb_mask').classList.add('show');
};
function hongbaoDoDaily(){
  var b=$('hb_openbtn'); b.disabled=true;
  post(HB.base+'daily','formhash='+HB.fh).then(function(r){return r.json();}).then(function(res){
    b.disabled=false;
    if(!res.ok){ if(res.already){ b.style.display='none'; $('hb_env').classList.remove('hasamt'); $('hb_env').classList.add('opened'); $('hb_statemsg').textContent=res.error||'今天已領過'; } else { alert(res.error||'領取失敗'); } return; }
    if($('hb_skipchk').checked){ try{ localStorage.setItem('hb_daily_skip',(HB.daily&&HB.daily.dateflag)||''); }catch(e){} }
    b.classList.add('spin');
    setTimeout(function(){ showResult(res.amount,false,false,false); $('hb_reclink').style.display='none';
      if(res.redirect){ setTimeout(function(){ location.href=res.redirect; },1600); } },520);
  }).catch(function(){ b.disabled=false; alert('網路錯誤'); });
}
window.hongbaoDoOpen=function(){
  var c=HB.cur; if(!c) return;
  if(c.isdaily){ return hongbaoDoDaily(); }
  var pw=c.haspw?$('hb_pw').value.trim():'';
  if(c.haspw&&!pw){ $('hb_pwerr').textContent='請輸入口令'; return; }
  var btn=$('hb_openbtn'); btn.disabled=true;
  post(HB.base+'grab','tid='+c.tid+'&formhash='+HB.fh+'&password='+encodeURIComponent(pw)).then(function(r){return r.json();}).then(function(res){
    btn.disabled=false;
    if(!res.ok){
      if(res.state==='badpw'){ $('hb_pwerr').textContent=res.error||'口令錯誤'; return; }
      if(res.state==='needreply'){ alert(res.error||'需先回帖'); hongbaoClose(); return; }
      alert(res.error||'領取失敗'); if(res.state==='done'){ $('hb_openbtn').style.display='none'; $('hb_env').classList.remove('hasamt'); $('hb_env').classList.add('opened'); $('hb_statemsg').textContent='紅包已被搶光'; } return;
    }
    btn.classList.add('spin');
    setTimeout(function(){ showResult(res.amount,res.iscat,res.best,false); },520);
  }).catch(function(){ btn.disabled=false; alert('網路錯誤,請再試一次'); });
};
window.hongbaoWithdraw=function(){
  var c=HB.cur; if(!c) return;
  if(!confirm('確定撤回這個紅包的剩餘份額?已被領走的不會追回,剩餘退回你的帳戶。')) return;
  var wd=$('hb_wdbtn'); wd.disabled=true;
  post(HB.base+'withdraw','tid='+c.tid+'&formhash='+HB.fh).then(function(r){return r.json();}).then(function(res){
    wd.disabled=false;
    if(!res.ok){ alert(res.error||'撤回失敗'); return; }
    wd.style.display='none'; $('hb_env').classList.remove('hasamt'); $('hb_env').classList.add('opened');
    $('hb_amt').textContent=''; $('hb_statemsg').textContent='已撤回,退回 '+res.refunded+' '+(c.unit||'');
    if(HB.cur.el){ HB.cur.el.classList.add('claimed'); var m=HB.cur.el.querySelector('.claimed-mark'); if(m){m.style.display='block';m.textContent='已撤回';} }
  }).catch(function(){ wd.disabled=false; alert('網路錯誤'); });
};
window.hongbaoToggleRecs=function(){
  var box=$('hb_recs');
  if(box.classList.contains('show')){ box.classList.remove('show'); return; }
  fetch(HB.base+'record&tid='+HB.cur.tid,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok){ alert(d.error||'無法取得記錄'); return; }
    var h='<div class="rh">已領取 '+d.claimed+'/'+d.shares+' 份</div>';
    d.recs.forEach(function(x){ h+='<div class="rec"><span>'+esc(x.username)+' · '+esc(x.time)+'</span><span>'+x.amount+' '+esc(d.unit)+(x.isbest?'<span class="tag">手氣最佳</span>':'')+'</span></div>'; });
    box.innerHTML=h; box.classList.add('show');
  });
};
function esc(s){return (''+s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
})();
