<link rel="stylesheet" href="source/plugin/atplus/static/at-panel.css?v=1.7.1" /><!-- rcd_report_dzx 0.30.2: group_not_allowed --><link rel="stylesheet" type="text/css" href="source/plugin/movepicker/static/movepicker.css?v=1.1.1" /><style>
.hb-entry{width:250px;max-width:100%;border-radius:10px;cursor:pointer;overflow:hidden;background:linear-gradient(160deg,#d1302f,#b82a29);color:#fdeede;box-shadow:0 3px 10px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;padding:14px 16px;transition:transform .15s;position:relative;margin:10px 0}
.hb-entry:hover{transform:translateY(-2px)}
.hb-entry .icon{width:38px;height:48px;flex:none;border-radius:5px;position:relative;background:#9f2424}
.hb-entry .icon::before{content:"";position:absolute;top:0;left:0;right:0;height:20px;background:rgba(255,255,255,.12);border-radius:0 0 50% 50%/0 0 10px 10px}
.hb-entry .icon::after{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffedbe,#f4d493 60%,#e5bd72)}
.hb-entry .t1{font-size:15px;font-weight:bold;margin-bottom:2px}
.hb-entry .t2{font-size:12px;opacity:.85}
.hb-entry .claimed-mark{position:absolute;right:10px;top:10px;font-size:11px;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:2px 8px;opacity:.85}
.hb-entry.claimed{filter:saturate(.55) brightness(.92)}
.hb-mask{}
.mask{--fxf:255,214,90;--fxr:255,220,120;--fxg:255,226,140;position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5000}
.mask.show{display:flex}
.env{width:300px;height:500px;border-radius:14px;position:relative;overflow:hidden;background:#9f2424;box-shadow:0 14px 50px rgba(0,0,0,.45);animation:hbpopin .35s cubic-bezier(.2,1.4,.4,1);color:#f4d493;font-family:inherit}
@keyframes hbpopin{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.env .flap{position:absolute;top:0;left:0;right:0;height:76%;z-index:2;background:linear-gradient(180deg,#d1302f 55%,#b82a29);border-radius:14px 14px 50% 50%/14px 14px 44px 44px;box-shadow:0 5px 12px rgba(0,0,0,.12);transition:transform .6s ease-in,opacity .5s}
.env.opened .flap{transform:translateY(-105%);opacity:.9}
.env .bless{position:absolute;top:34%;left:0;right:0;z-index:3;text-align:center;font-size:19px;letter-spacing:2px;padding:0 26px;line-height:1.6;transition:opacity .3s}
.env .from{position:absolute;top:26%;left:0;right:0;z-index:3;text-align:center;font-size:13px;opacity:.8;transition:opacity .3s}
.env.opened .bless,.env.opened .from{opacity:0}
.env .open-btn{position:absolute;top:76%;left:50%;transform:translate(-50%,-50%);z-index:4;width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffedbe,#f4d493 62%,#e5bd72);color:#8d6f3a;font-size:32px;font-weight:bold;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 -3px 6px rgba(0,0,0,.12);animation:hbbreath 1.8s ease-in-out infinite}
@keyframes hbbreath{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
.env .open-btn.spin{animation:hbspin .6s ease-in forwards}
@keyframes hbspin{to{transform:translate(-50%,-50%) rotateY(720deg) scale(.4);opacity:0}}
.env .pwbox{position:absolute;top:55%;left:0;right:0;z-index:3;padding:0 44px;display:none;transition:opacity .3s}
.env.haspw .pwbox{display:block}
.env.opened .pwbox{opacity:0}
.env .pwbox input{width:100%;border:none;border-radius:8px;padding:10px 12px;font-size:15px;text-align:center;letter-spacing:2px;background:rgba(0,0,0,.18);color:#fff;outline:none}
.env .pwbox input::placeholder{color:rgba(255,255,255,.55);letter-spacing:0}
.env .pwbox .pwerr{text-align:center;font-size:12px;margin-top:8px;color:#ffd9d0;min-height:14px}
.env .inner{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;opacity:0;transition:opacity .45s .25s}
.env.opened .inner{opacity:1}
.env .inner .who{font-size:13px;opacity:.75;margin-bottom:6px}
.env .inner .bless2{font-size:15px;margin-bottom:26px;opacity:.9}
.env .inner .amt{font-size:52px;font-weight:bold;line-height:1;animation:hbamtup .5s .35s ease-out backwards}
@keyframes hbamtup{from{opacity:0;transform:translateY(18px) scale(.85)}to{opacity:1;transform:none}}
.env .inner .unit{font-size:14px;opacity:.85;margin-top:8px}
.env .inner .stored{font-size:12px;opacity:.6;margin-top:4px}
.env .inner .statemsg{font-size:15px;margin-top:10px;opacity:.9}
.env .inner .reclink{margin-top:24px;font-size:13px;opacity:.85;cursor:pointer;border-bottom:1px dashed #f4d493;padding-bottom:2px;display:none}
.env .recs{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;color:#333;border-radius:14px 14px 0 0;max-height:0;overflow:hidden;transition:max-height .4s}
.env .recs.show{max-height:46%;overflow:auto}
.env .recs .rh{font-size:12px;color:#999;padding:12px 18px 6px}
.env .recs .rec{display:flex;justify-content:space-between;padding:7px 18px;font-size:13px;border-bottom:1px dashed #eee}
.env .recs .tag{color:#c9a227;font-size:12px;margin-left:6px}
.cat{position:absolute;left:50%;top:30px;z-index:6;font-size:74px;line-height:1;transform:translate(-50%,60px) scale(.2);opacity:0;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.cat.jump{animation:hbcatdrop 1.05s .35s cubic-bezier(.25,.9,.3,1) forwards,hbcatidle 1.6s 1.45s ease-in-out infinite}
@keyframes hbcatdrop{0%{transform:translate(-50%,-460px) scale(1.5) rotate(-25deg);opacity:0}12%{opacity:1}55%{transform:translate(-50%,-116px) scale(1,1) rotate(6deg)}64%{transform:translate(-50%,-102px) scale(1.35,.68) rotate(0)}76%{transform:translate(-50%,-148px) scale(.88,1.16) rotate(-5deg)}88%{transform:translate(-50%,-112px) scale(1.08,.94) rotate(2deg)}100%{transform:translate(-50%,-116px) scale(1) rotate(0);opacity:1}}
@keyframes hbcatidle{0%,100%{transform:translate(-50%,-116px) rotate(0)}25%{transform:translate(-50%,-122px) rotate(-6deg)}75%{transform:translate(-50%,-122px) rotate(6deg)}}
.bigtag{position:absolute;left:50%;top:-16px;transform:translateX(-50%);z-index:6;background:linear-gradient(180deg,#ffedbe,#f4d493);color:#8d6f3a;font-size:13px;font-weight:bold;letter-spacing:2px;padding:4px 14px;border-radius:14px;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.bigtag.show{animation:hbstamp .55s 1.05s cubic-bezier(.2,1.6,.4,1) forwards,hbtagglow 1.4s 1.6s ease-in-out infinite}
@keyframes hbstamp{0%{opacity:0;transform:translateX(-50%) scale(3.2) rotate(-14deg)}60%{opacity:1;transform:translateX(-50%) scale(.9) rotate(3deg)}80%{transform:translateX(-50%) scale(1.06) rotate(-1deg)}100%{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}}
@keyframes hbtagglow{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.3),0 0 0 rgba(255,215,90,0)}50%{box-shadow:0 3px 8px rgba(0,0,0,.3),0 0 22px rgba(255,215,90,.9)}}
.fx-night{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 40%,rgba(20,24,70,.55),rgba(4,6,24,.88))}
.fx-night.go{transition:opacity .4s;opacity:1}
.fx-night.out{transition:opacity 1s;opacity:0!important}
.fx-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;display:none}
.fx-flash{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,245,.95),rgba(var(--fxf),.6) 35%,rgba(var(--fxf),0) 70%)}
.fx-flash.go{animation:hbflash .7s ease-out}
@keyframes hbflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.fx-rays{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;opacity:0;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(var(--fxr),.42) 0deg 7deg,rgba(var(--fxr),0) 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%)}
.fx-rays.go{animation:hbraysin .5s ease-out forwards,hbraysspin 9s linear infinite}
.fx-rays.out{transition:opacity .8s;opacity:0!important}
@keyframes hbraysin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes hbraysspin{to{rotate:360deg}}
.fx-ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;opacity:0;z-index:5;border:6px solid rgba(var(--fxg),.95);box-shadow:0 0 30px rgba(var(--fxg),.9),inset 0 0 20px rgba(255,255,240,.8)}
.fx-ring.go{animation:hbring .75s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes hbring{0%{opacity:1;transform:scale(.2);border-width:14px}100%{opacity:0;transform:scale(7);border-width:1px}}
.env.hit{animation:hbhit .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes hbhit{10%,90%{transform:translate(-2px,1px) rotate(-.6deg)}20%,80%{transform:translate(4px,-2px) rotate(.8deg)}30%,50%,70%{transform:translate(-7px,3px) rotate(-1.2deg)}40%,60%{transform:translate(7px,-3px) rotate(1.2deg)}}
.env .inner .amt.fxglow{color:#fff3c4;text-shadow:0 0 10px rgba(255,214,90,.95),0 0 28px rgba(255,170,40,.8);animation:hbamtpulse .45s ease-out}
@keyframes hbamtpulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cat.jump{animation:none;opacity:1;transform:translate(-50%,-116px)}.bigtag.show{animation:none;opacity:1}.fx-rays,.fx-ring,.fx-flash,.fx-canvas,.fx-night{display:none!important}.env.hit{animation:none}}
.env .wd-btn{position:absolute;top:76%;left:50%;transform:translate(-50%,-50%);z-index:4;width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff2d8,#e5bd72 62%,#c99a4a);color:#6b4f22;font-size:18px;font-weight:bold;font-family:inherit;line-height:1.2;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.env .wd-btn.mini{top:93%;width:auto;height:auto;padding:4px 14px;border-radius:14px;font-size:13px;line-height:1.4}
.env .wd-btn.mini br{display:none}
.env-close{position:absolute;left:50%;transform:translateX(-50%);bottom:-56px;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:none;color:#fff;font-size:16px;cursor:pointer;opacity:.85}
.daily-skip{position:absolute;left:0;right:0;bottom:-92px;text-align:center;color:rgba(255,255,255,.85);font-size:12px;cursor:pointer}
.env-wrap{position:relative}
.float-hb{position:fixed;right:22px;bottom:82px;z-index:4000;cursor:pointer;width:54px;height:68px;animation:hbfloaty 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@keyframes hbfloaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.float-hb .body{width:100%;height:100%;border-radius:8px;position:relative;overflow:hidden;background:linear-gradient(170deg,#d1302f,#b82a29)}
.float-hb .body::before{content:"";position:absolute;top:0;left:0;right:0;height:34px;background:rgba(255,255,255,.1);border-radius:0 0 50% 50%/0 0 16px 16px}
.float-hb .dot{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffedbe,#f4d493 60%,#e5bd72)}
.float-hb .lbl{position:absolute;bottom:7px;width:100%;text-align:center;color:#fdeede;font-size:11px;letter-spacing:1px}
</style>
<div class="mask" id="hb_mask">
  <div class="fx-night" id="hb_night"></div>
  <div class="fx-flash" id="hb_flash"></div>
  <canvas class="fx-canvas" id="hb_fx"></canvas>
  <div class="env-wrap">
    <div class="fx-rays" id="hb_rays"></div>
    <div class="fx-ring" id="hb_ring"></div>
    <div class="env" id="hb_env">
      <div class="flap"></div>
      <div class="from" id="hb_from"></div>
      <div class="bless" id="hb_bless"></div>
      <div class="pwbox"><input type="text" id="hb_pw" placeholder="輸入口令" maxlength="64" autocomplete="off"><div class="pwerr" id="hb_pwerr"></div></div>
      <button class="open-btn" id="hb_openbtn" onclick="hongbaoDoOpen()">開</button>
      <button class="wd-btn" id="hb_wdbtn" onclick="hongbaoWithdraw()" style="display:none">撤回<br>剩餘</button>
      <div class="inner">
        <div class="who" id="hb_who"></div>
        <div class="bless2" id="hb_bless2"></div>
        <div class="amt" id="hb_amt"></div>
        <div class="unit" id="hb_unit"></div>
        <div class="stored">已存入你的帳戶</div>
        <div class="reclink" id="hb_reclink" onclick="hongbaoToggleRecs()">看看大家的手氣 ›</div>
        <div class="statemsg" id="hb_statemsg"></div>
      </div>
      <div class="recs" id="hb_recs"></div>
    </div>
    <div class="cat" id="hb_cat"></div>
    <div class="bigtag" id="hb_bigtag">手 氣 爆 發 !</div>
    <button class="env-close" onclick="hongbaoClose()">✕</button>
    <label class="daily-skip" id="hb_dailyskip" style="display:none"><input type="checkbox" id="hb_skipchk"> 今日不再顯示</label>
  </div>
</div>
