name: Release build

on:
  push:
    tags:
      - "v*"

env:
  CI_FLUTTER_VERSION: "3.41.5" # Do NOT remove or rename the variable otherwise will break FDroid workflows.
  CI_RUST_VERSION: "1.83.0" # Keep a same rust version on all compile targets.

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: ${{ env.PRERELEASE }}
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          prerelease: ${{ env.PRERELEASE }}
          allowUpdates: true
          omitPrereleaseDuringUpdate: true
          body: "${{ steps.extract-release-notes.outputs.release_notes }}"

  build-linux:
    name: Build Linux
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev sqlite3 libsqlite3-dev libayatana-appindicator3-dev libmpv-dev
      - name: Precompile
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build Linux
        run: flutter build linux --release
      - name: Pre Packing
        run: |
          pushd build/linux/x64/release/
          mv bundle tsdm_client
          popd
      - name: Pack Linux tarball
        uses: thedoctor0/zip-release@master
        with:
          type: "tar"
          filename: tsdm_client-linux.tar.gz
          directory: build/linux/x64/release/
          path: tsdm_client
      - name: Release Linux artifacts
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "build/linux/x64/release/tsdm_client-linux.tar.gz"
  build-android:
    name: Build Android
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - run: |
          sudo ./scripts/github_free_disk_space.sh
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev
          git submodule update --init --recursive --force
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{env.CI_RUST_VERSION}}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Update NDK path
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - name: Prepare flutter_avif
        run: |
          sudo apt install -y make meson nasm
          cargo install cargo-ndk@3.5.4 --locked
          ./scripts/build-flutter_avif-android.sh
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Precompile
        run: |
          flutter pub get
          dart ./Makefile.dart
      - name: Maven Central through a mirror
        # Maven Central hands the big Kotlin jars over to GitHub Releases, which times out now and then (504): every
        # Central repository of the invocation (Flutter's gradle plugin included) is pointed at a mirror of Central.
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/kotlin-mirror.gradle <<'GRADLE'
          // Every Maven Central repository of every build in this invocation points at a mirror of Central instead:
          // rewriting a URL adds no repository, so FAIL_ON_PROJECT_REPOS and exclusive-content rules are untouched.
          def mirror = 'https://maven.aliyun.com/repository/central/'
          def central = { String u -> u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org') }
          def reroute = { RepositoryHandler handler ->
            handler.all { repo ->
              if (repo instanceof MavenArtifactRepository && central(repo.url.toString())) {
                repo.url = mirror
              }
            }
          }
          settingsEvaluated { settings ->
            reroute(settings.pluginManagement.repositories)
            reroute(settings.dependencyResolutionManagement.repositories)
          }
          allprojects {
            reroute(buildscript.repositories)
            reroute(repositories)
          }
          GRADLE
          cat ~/.gradle/init.d/kotlin-mirror.gradle
      - name: Gradle distribution fallback
        # GitHub's release downloads (services.gradle.org redirects there) time out now and then: take a mirror then.
        run: |
          url=$(grep -oP '^distributionUrl=\K.*' android/gradle/wrapper/gradle-wrapper.properties | sed 's#\\##g')
          if ! curl -fsSL --max-time 60 -r 0-0 -o /dev/null "$url"; then
            echo "gradle distribution unreachable at $url, using a mirror"
            sed -i 's#https\\://services.gradle.org/distributions/#https\\://mirrors.cloud.tencent.com/gradle/#' android/gradle/wrapper/gradle-wrapper.properties
            grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Setup Android sign key
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > android/app/key.jks
          echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties
      - name: Build Android
        run: |
          flutter build apk --release
      - name: Pack Android apk
        run: |
          pushd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk tsdm_client-arm64_v8a.apk
          mv app-armeabi-v7a-release.apk tsdm_client-armeabi_v7a.apk
          mv app-release.apk tsdm_client-universal.apk
          popd
      - name: Release Android artifacts
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "build/app/outputs/flutter-apk/tsdm_client-arm64_v8a.apk,build/app/outputs/flutter-apk/tsdm_client-armeabi_v7a.apk,build/app/outputs/flutter-apk/tsdm_client-universal.apk"

  build-windows:
    name: Build Windows
    needs: [release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
      - name: Precompile
        shell: pwsh
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: libmpv archive fallback
        # media_kit downloads libmpv from GitHub Releases, which times out now and then: our copy is placed first
        # (CMake keeps a file whose MD5 matches and skips the download).
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/windows/x64
          gh release download assets-ci-1 --repo "$GITHUB_REPOSITORY" -p 'mpv-dev-x86_64-20230924-git-652a1dd.7z' -D build/windows/x64 --clobber \
            || echo "fallback copy unavailable, CMake will download"
      - name: Build Windows
        run: flutter build windows --release
      - name: Pre Packing
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Rename-Item Release tsdm_client
          cd ../../../../
      - name: Pack Windows tarball
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: tsdm_client-windows.zip
          directory: build/windows/x64/runner
          path: tsdm_client
      - name: Release Windows artifacts
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "build/windows/x64/runner/tsdm_client-windows.zip"
  build-macos-and-ios:
    name: Build MacOS and iOS
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - name: Precompile
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build MacOS
        run: |
          flutter build macos --release
      - name: Packing MacOS dmg
        run: |
          brew install python-setuptools
          npm install -g appdmg
          appdmg appdmg.json build/tsdm_client-universal.dmg
      - name: Release macOS artifacts
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "build/tsdm_client-universal.dmg"
      - name: Build iOS ipa
        run: |
          flutter build ios --release --no-codesign
      - name: Packing
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r9 tsdm_client.ipa Payload
      - name: Release iOS artifacts
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "tsdm_client.ipa"
