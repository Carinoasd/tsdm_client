# Manual runs: Actions -> "Test build" -> Run workflow; tick only the platforms
# you need and untick dry_run to get the build as a workflow artifact.
name: Test build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      stage_issue96:
        description: Verify the fixed issue 96 build and upload APKs to its existing draft release.
        required: true
        type: boolean
        default: false
      build_android:
        description: Build Android platform artifacts.
        required: true
        type: boolean
        default: true
      build_ios:
        description: Build iOS platform artifacts.
        required: true
        type: boolean
        default: true
      build_linux:
        description: Build Linux platform artifacts.
        required: true
        type: boolean
        default: true
      build_macos:
        description: Build MacOS platform artifacts.
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows platform artifacts.
        required: true
        type: boolean
        default: true
      dry_run:
        description: Dry run, do NOT upload artifacts.
        required: true
        type: boolean
        default: true

env:
  CI_FLUTTER_VERSION: "3.41.5"
  CI_RUST_VERSION: "1.83.0"

jobs:
  stage-issue96:
    name: Verify and stage issue 96 APKs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage_issue96 }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '35621037854'
      TEST_RUN: '35621040171'
      SOURCE_SHA: 1632646c0a5180235ca5428ffdb411ff2bf53c7d
      RELEASE_TAG: test-blocking-96-20260921-2
      SIGNER_SHA256: 71f7ca2c928a6af8d5d954e36bb5c6eea96f9a1fb82138ad399eda5851108f23
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Verify source and completed checks
        shell: bash
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$TEST_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" > "$run.json"
            jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .head_branch == "feat/silent-blocking" and .conclusion == "success"' "$run.json"
          done
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish | jq -e --arg sha "$SOURCE_SHA" '.isDraft and .isPrerelease and .targetCommitish == $sha'
      - name: Download and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --name tsdm_client-apk-arm64_v8a --dir apks
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          cd apks
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 3
          for variant in arm64_v8a armeabi_v7a universal; do
            apk="tsdm_client-$variant.apk"
            case "$variant" in arm64_v8a) code=813 ;; armeabi_v7a) code=812 ;; universal) code=819 ;; esac
            "$build_tools/apksigner" verify --print-certs "$apk" > "$variant-signature.txt"
            grep -Fx "Signer #1 certificate SHA-256 digest: $SIGNER_SHA256" "$variant-signature.txt"
            "$build_tools/aapt" dump badging "$apk" > "$variant-manifest.txt"
            grep -E "^package: name='com.tsdm.tsdm_client' versionCode='$code' versionName='1.27.1-blocking.2'" "$variant-manifest.txt"
            if grep -q '^application-debuggable' "$variant-manifest.txt"; then exit 1; fi
            grep -E '^(sdkVersion|targetSdkVersion|native-code):' "$variant-manifest.txt"
          done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          printf 'Source: %s\nBuild run: %s\nTest run: %s\nOfficial signing certificate SHA-256: %s\n' "$SOURCE_SHA" "$BUILD_RUN" "$TEST_RUN" "$SIGNER_SHA256" > BUILD-INFO.txt
      - name: Upload verified APKs to draft only
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" apks/*.apk apks/SHA256SUMS.txt apks/BUILD-INFO.txt
  build-linux:
    name: Build Linux
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev sqlite3 libsqlite3-dev libayatana-appindicator3-dev
      - name: Precompile
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build Linux
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.build_linux }}
        run: flutter build linux --release
      - name: Pre Packing
        if: ${{ github.event_name == 'push' || inputs.build_linux }}
        run: |
          pushd build/linux/x64/release/
          mv bundle tsdm_client
          popd
      - name: Pack Linux tarball
        if: ${{ github.event_name == 'push' || inputs.build_linux }}
        uses: thedoctor0/zip-release@master
        with:
          type: "tar"
          filename: tsdm_client-linux.tar.gz
          directory: build/linux/x64/release/
          path: tsdm_client
      - name: Upload Linux artifacts
        if: ${{ github.event_name != 'push' && inputs.build_linux && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-linux-tarball
          path: build/linux/x64/release/tsdm_client-linux.tar.gz
  build-android:
    name: Build Android
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - run: |
          sudo ./scripts/github_free_disk_space.sh
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev
          git submodule update --init --recursive --force
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{env.CI_RUST_VERSION}}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Update NDK path
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - name: Prepare flutter_avif
        run: |
          sudo apt install -y make meson nasm
          cargo install cargo-ndk@3.5.4 --locked
          ./scripts/build-flutter_avif-android.sh
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Precompile
        run: |
          flutter pub get
          dart ./Makefile.dart
      - name: Setup Android sign key
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > android/app/key.jks
          echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties
      - name: Build Android
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        run: |
          flutter build apk --release --build-name=1.27.1-blocking.2 --build-number=81
      - name: Pack Android apk
        if: ${{ github.event_name == 'push' || inputs.build_android }}
        run: |
          pushd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk tsdm_client-arm64_v8a.apk
          mv app-armeabi-v7a-release.apk tsdm_client-armeabi_v7a.apk
          mv app-release.apk tsdm_client-universal.apk
          popd
      - name: Upload Android artifacts
        if: ${{ github.event_name != 'push' && inputs.build_android && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-apk-arm64_v8a
          path: |
            build/app/outputs/flutter-apk/tsdm_client-arm64_v8a.apk
            build/app/outputs/flutter-apk/tsdm_client-armeabi_v7a.apk
            build/app/outputs/flutter-apk/tsdm_client-universal.apk
  build-windows:
    name: Build Windows
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
      - name: Precompile
        shell: pwsh
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build Windows
        run: flutter build windows --release
      - name: Pre Packing
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Rename-Item Release tsdm_client
          cd ../../../../
      - name: Pack Windows tarball
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: tsdm_client-windows.zip
          directory: build/windows/x64/runner
          path: tsdm_client
      - name: Upload Windows artifacts
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-windows-tarball
          path: build/windows/x64/runner/tsdm_client-windows.zip
  build-macos-and-ios:
    name: Build MacOS and iOS
    if: ${{ github.event_name == 'push' || inputs.build_macos || inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - name: Precompile
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build MacOS
        if: ${{ github.event_name == 'push' || inputs.build_macos }}
        run: |
          flutter build macos --release
      - name: Packing MacOS dmg
        if: ${{ github.event_name == 'push' || inputs.build_macos }}
        run: |
          brew install python-setuptools
          npm install -g appdmg
          appdmg appdmg.json build/tsdm_client-universal.dmg
      - name: Upload MacOS artifacts
        if: ${{ github.event_name != 'push' && inputs.build_macos && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-macos-tarball
          path: build/tsdm_client-universal.dmg
      - name: Build iOS ipa
        if: ${{ github.event_name == 'push' || inputs.build_ios }}
        run: |
          flutter build ios --release --no-codesign
      - name: Packing
        if: ${{ github.event_name == 'push' || inputs.build_ios }}
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r9 tsdm_client.ipa Payload
      - name: Upload iOS artifacts
        if: ${{ github.event_name != 'push' && inputs.build_ios && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-ios-tarball
          path: tsdm_client.ipa
