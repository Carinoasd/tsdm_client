name: Android browser routing
on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/**/Browser*.kt'
      - 'android/app/src/test/kotlin/**/Browser*Test.kt'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'scripts/browser-routing-tests/**'
      - '.github/workflows/browser_routing_test.yml'
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test native browser routing without APK build
        working-directory: scripts/browser-routing-tests
        run: gradle testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-routing-test-reports
          path: scripts/browser-routing-tests/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
